description = "Generates a Git commit message based on staged changes."

# The prompt uses !{...} to execute the command and inject its output.
prompt = """
Generate a commit message, listing & summarizing the main changes, based on the following git diff:

```diff
!{git diff --staged}
```
Before each changes, use capitalized words "STYLE CHANGES:", "BUG FIXES:", "NEW FEATURES:", "DOCS:" etc. to let viewer clear see what changes.

"""